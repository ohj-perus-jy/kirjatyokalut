# Kirjojen yhteiset Zensical-asetukset. convert.py kirjoittaa tämän kirjan
# nav.yml:n alkuun (build_base), ja kirjan mkdocs.yml perii sen INHERITillä;
# kirjan oma arvo voittaa. Tänne lisätään vain se, minkä jokin mdBookin
# ominaisuus vaatii. Polut ovat suhteessa kirjan mkdocs.yml:ään.
docs_dir: docs
site_dir: site

# Muokkauslinkin osoite kootaan kirjan repo_url + edit_uri + sivun polku.
# edit_uri osoittaa lähdepuuhun src/, koska docs/ on convert.py:n kopio eikä
# versionhallinnassa; siirretyt sivut hoitaa extra.edit_source (build_extra).
edit_uri: edit/main/src/

theme:
  name: material

  # Mallien ylikirjoitukset (mm. muokkauslinkki alatunnisteessa), ks. overrides/.
  # TYOKALUT = polku kirjan hakemistosta tänne, ks. convert.py: build_base.
  custom_dir: TYOKALUT/overrides
  language: fi

  # Otsikoiden, valikon ja yläpalkin kirjasin. Source Sans 3 on leipätekstin
  # Source Serif 4:n (typography.css) sisarkirjasin, joten mittasuhteet täsmäävät.
  font:
    text: Source Sans 3

  features:
    # Osan otsikko on itse linkki osan etusivulle, kuten mdBookissa.
    - navigation.indexes

    # Edellinen/seuraava sivun alareunassa, kuten mdBookissa.
    - navigation.footer

    # Käyttöjärjestelmävälilehdet: valinta valitsee saman otsikon kaikkialta ja
    # muistetaan sivulta toiselle. Ks. convert.py: convert_tabs.
    - content.tabs.link

  # Teema seuraa käyttöjärjestelmää ja vaihdin ohittaa sen, kuten book.tomlin
  # default-theme / preferred-dark-theme. Värit ovat Materialin omat.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Vaihda tummaan teemaan
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Vaihda vaaleaan teemaan

extra_css:
  # Leipätekstin kirjasin; miksi ei theme.font.text, ks. tiedoston alku.
  - assets/css/typography.css

  # Kirjasinvalikko yläpalkissa (overrides/partials/header.html, assets/js/fontmenu.js).
  - assets/css/fontmenu.css
  - assets/css/layout.css

  # Sivustovalikko yläpalkissa (assets/js/sitemenu.js).
  - assets/css/sitemenu.css

  # Hakuikkunan tekstikoot ja suodatinpaneelin piilotus. Ikkuna on shadow
  # DOM:issa, johon assets/js/search.js liittää tämän tiedoston.
  - assets/css/search.css

  # Alerttilaatikot classic-variantin ilmeeseen; miksi ei theme.variant, ks. tiedoston alku.
  - assets/css/admonitions.css

  # Tehtäväkortit (convert.py: convert_tasks) ja bonusmerkin väri (.jyu-bonus).
  - assets/css/tasks.css

  # Valikkopolun erottimen väri (convert.py: convert_icons).
  - assets/css/icons.css

  # Taulukot: keskitys, otsikkorivi ja vuororivit kuten kirjassa.
  - assets/css/tables.css

  # Koodin tausta erottumaan sivun taustasta; ks. tiedoston alku.
  - assets/css/code.css

  # Harjoitustyön vaatimusnumerot CSS-laskurista.
  - assets/css/requirements.css

  # Luokkakaaviot (convert.py).
  - assets/css/diagrams.css

  # Koodilohkon nappirivin pohja; ennen playground.css:ää ja hidelines.css:ää,
  # jotka antavat vain oman kuvakkeensa.
  - assets/css/codebuttons.css

  # Ajonapin kuvake ja tuloste (assets/js/playground.js).
  - assets/css/playground.css

  # Korostetut rivit. Ennen hidelines.css:ää: piilotuksen display: none
  # voittaa korostuksen display: block vain myöhempänä.
  - assets/css/highlights.css

  # Piilorivit ja silmänappi (assets/js/hidelines.js).
  - assets/css/hidelines.css

  - assets/css/print.css

  # Vaiheittainen ohje (assets/js/walkthrough.js).
  - assets/css/walkthrough.css

  # Testaa tietosi -visa (convert.py: convert_quizzes, assets/js/visa.js).
  # admonitions.css:n jälkeen: perustelulaatikon värit voittavat myöhempänä.
  - assets/css/visa.css

extra_javascript:
  # Alalukujen avaaminen ei vieritä valikkoa; ks. assets/js/nav-scroll.js.
  - assets/js/nav-scroll.js

  # Koko kirja yhdelle sivulle (/tulosta/).
  - assets/js/print.js

  # Kirjasinvalikon toiminta.
  - assets/js/fontmenu.js

  # Sivustovalikon avaus ja sulkeminen.
  - assets/js/sitemenu.js

  # Hakuikkunan tyyli (assets/css/search.css) shadow DOM:iin.
  - assets/js/search.js

  # Ohjelmien ajonapit (mdBookin theme/playground_ext.js).
  - assets/js/playground.js

  # Piilorivit ja silmänappi. Ajonapin jälkeen, jotta nappirivin järjestys on
  # sama kuin kirjassa.
  - assets/js/hidelines.js

  # Korostetut rivit; järjestyksellä ei väliä.
  - assets/js/highlights.js

  # Terminaalinauhoitusten soitin; soitin ja tyyli haetaan vasta sivulla,
  # jolla on nauhoitus.
  - assets/js/asciinema.js

  # Vaiheittainen ohje. Sivun oma kohtaustiedosto on sisällössä <script>-tagina
  # (convert.py: convert_walkthroughs), joten se on ajettu ennen tätä.
  - assets/js/walkthrough.js

  # Testaa tietosi -visan napit ja vastausten muisti.
  - assets/js/visa.js
