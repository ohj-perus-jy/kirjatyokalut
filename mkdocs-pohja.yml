# Kirjojen yhteiset Zensical-asetukset. convert.py kirjoittaa tämän kirjan
# nav.yml:n alkuun (build_base), ja kirjan mkdocs.yml perii sen INHERITillä;
# kirjan oma arvo voittaa. Tänne lisätään vain se, minkä jokin mdBookin
# ominaisuus vaatii. Polut ovat suhteessa kirjan mkdocs.yml:ään.
docs_dir: docs
site_dir: site

# Muokkauslinkin osoite kootaan kirjan repo_url + edit_uri + sivun polku.
# edit_uri osoittaa lähdepuuhun src/, koska docs/ on convert.py:n kopio eikä
# versionhallinnassa; siirretyt sivut hoitaa extra.edit_source (build_extra).
edit_uri: edit/main/src/

theme:
  name: material

  # Mallien ylikirjoitukset (mm. muokkauslinkki alatunnisteessa), ks. overrides/.
  # TYOKALUT = polku kirjan hakemistosta tänne, ks. convert.py: build_base.
  custom_dir: TYOKALUT/overrides
  language: fi

  # Kirjasimet tulevat sivuston omasta assets/fonts/-hakemistosta
  # (assets/css/fonts.css), ei Google Fontsista: false jättää base.html:stä
  # pois sekä Google Fontsin linkin että muuttujat --md-text-font ja
  # --md-code-font, jotka fonts.css asettaa (otsikoiden, valikon ja yläpalkin
  # Source Sans 3, koodin JetBrains Mono). Kirjan oma theme.font toisi Google
  # Fontsin takaisin; tests/test_book.py tarkistaa. Ks. PERUSTELUT.md, Kirjasimet.
  font: false

  features:
    # Osan otsikko on itse linkki osan etusivulle, kuten mdBookissa.
    - navigation.indexes

    # Edellinen/seuraava sivun alareunassa, kuten mdBookissa.
    - navigation.footer

    # Käyttöjärjestelmävälilehdet: valinta valitsee saman otsikon kaikkialta ja
    # muistetaan sivulta toiselle. Ks. convert.py: convert_tabs.
    - content.tabs.link

    # Alaviite näkyy viitemerkin päällä ponnahdusikkunana.
    - content.footnote.tooltips

    # Linkin otsikko ym. title-attribuutit teeman tooltipeinä.
    - content.tooltips

    # Sisällysluettelo vierii itse niin, että luettava kohta näkyy. Sen oma
    # vierityspalkki näkyy vain osoittimella (layout.css), koska se oli
    # muuten heti selaimen palkin vieressä.
    - toc.follow

    # Kopiointinappi koodilohkoihin, kuten mdBookissa. Teema kopioi näkyvän
    # tekstin (innerText): piilorivit (hidelines.js) tulevat mukaan vain, jos
    # lukija on ottanut ne esiin silmänapilla. console-lohkosta kopioidaan vain
    # komennot ilman kehotetta, eikä kehote tartu hiirellä maalattuunkaan
    # tekstiin (assets/js/copy.js).
    - content.code.copy

  # Teema seuraa käyttöjärjestelmää ja vaihdin ohittaa sen, kuten book.tomlin
  # default-theme / preferred-dark-theme. Värit ovat Materialin omat.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Vaihda tummaan teemaan
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Vaihda vaaleaan teemaan

# Markdown-laajennukset. Lista korvaa Zensicalin oletukset kokonaan
# (zensical/config.py: DEFAULT_MARKDOWN_EXTENSIONS), joten tässä ovat kaikki
# oletukset sellaisinaan; vain toc:n permalink_title on lisätty, koska
# otsikkoankkurin title-attribuutti ("Permanent link") ei tule teeman
# kielipaketista vaan laajennuksen oletuksesta.
markdown_extensions:
  abbr: {}
  admonition: {}
  attr_list: {}
  def_list: {}
  footnotes: {}
  md_in_html: {}
  toc:
    permalink: true
    permalink_title: Pysyvä linkki tähän otsikkoon
  pymdownx.arithmatex:
    generic: true
  pymdownx.betterem: {}
  pymdownx.caret: {}
  pymdownx.details: {}
  pymdownx.emoji:
    emoji_generator: zensical.extensions.emoji.to_svg
    emoji_index: zensical.extensions.emoji.twemoji
  pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
  pymdownx.inlinehilite: {}
  pymdownx.keys: {}
  pymdownx.magiclink: {}
  pymdownx.mark: {}
  pymdownx.smartsymbols: {}
  # Mermaid-aidat piirtää convert.py (convert_mermaid), ei teeman mermaid.js,
  # joten custom_fences-kohtaa ei ole: piirtämättä jäänyt aita näkyy koodina.
  pymdownx.superfences: {}
  pymdownx.tabbed:
    alternate_style: true
    combine_header_slug: true
  pymdownx.tasklist:
    custom_checkbox: true
  pymdownx.tilde: {}

extra_css:
  # Kirjasintiedostot (@font-face) ja teeman kirjasinmuuttujat; ensimmäisenä,
  # jotta leipätekstin lataus alkaa heti. Generoitu: skriptit/fontit.py.
  - assets/css/fonts.css

  # Leipätekstin kirjasin; miksi ei theme.font.text, ks. tiedoston alku.
  - assets/css/typography.css

  # Kirjasinvalikko yläpalkissa (overrides/partials/header.html, assets/js/fontmenu.js).
  - assets/css/fontmenu.css
  - assets/css/layout.css

  # Sivustovalikko yläpalkissa (assets/js/sitemenu.js).
  - assets/css/sitemenu.css

  # Hakuikkunan tekstikoot ja suodatinpaneelin piilotus. Ikkuna on shadow
  # DOM:issa, johon assets/js/search.js liittää tämän tiedoston.
  - assets/css/search.css

  # Alerttilaatikot classic-variantin ilmeeseen; miksi ei theme.variant, ks. tiedoston alku.
  - assets/css/admonitions.css

  # Tehtäväkortit (convert.py: convert_tasks) ja bonusmerkin väri (.jyu-bonus).
  - assets/css/tasks.css

  # Valikkopolun erottimen väri (convert.py: convert_icons).
  - assets/css/icons.css

  # Taulukot: keskitys, otsikkorivi ja vuororivit kuten kirjassa.
  - assets/css/tables.css

  # Koodin tausta erottumaan sivun taustasta; ks. tiedoston alku.
  - assets/css/code.css

  # Harjoitustyön vaatimusnumerot CSS-laskurista.
  - assets/css/requirements.css

  # Kaaviot (convert.py: mermaid, svgbob, plantuml).
  - assets/css/diagrams.css

  # Koodilohkon nappirivin pohja; ennen playground.css:ää ja hidelines.css:ää,
  # jotka antavat vain oman kuvakkeensa.
  - assets/css/codebuttons.css

  # Ajonapin kuvake ja tuloste (assets/js/playground.js).
  - assets/css/playground.css

  # Korostetut rivit. Ennen hidelines.css:ää: piilotuksen display: none
  # voittaa korostuksen display: block vain myöhempänä.
  - assets/css/highlights.css

  # Piilorivit ja silmänappi (assets/js/hidelines.js).
  - assets/css/hidelines.css

  # Kopiointinapin kuittaus napin vieressä ja komentorivilohkon kehote, jota
  # ei voi maalata (assets/js/copy.js).
  - assets/css/copy.css

  - assets/css/print.css

  # Vaiheittainen ohje (assets/js/walkthrough.js).
  - assets/css/walkthrough.css

  # Koko sivun ääneenluku (assets/js/puhe.js).
  - assets/css/puhe.css

  # Testaa tietosi -visa (convert.py: convert_quizzes, assets/js/visa.js).
  # admonitions.css:n jälkeen: perustelulaatikon värit voittavat myöhempänä.
  - assets/css/visa.css

extra_javascript:
  # Nappien vihjeet myöhemmin lisätyille napeille ja vihjeen sulkeminen
  # napautuksen jälkeen. Ensimmäisenä, ks. assets/js/tooltips.js.
  - assets/js/tooltips.js

  # Alalukujen avaaminen ei vieritä valikkoa; ks. assets/js/nav-scroll.js.
  - assets/js/nav-scroll.js

  # Kapean näytön sisällysluettelo sulkeutuu, kun kohtaa tai ulkopuolta napautetaan;
  # sivupalkin sisällysluettelon häivytys ylä- ja alareunassa.
  - assets/js/toc.js

  # Koko kirja yhdelle sivulle (/tulosta/).
  - assets/js/print.js

  # Kirjasinvalikon toiminta.
  - assets/js/fontmenu.js

  # Sivustovalikon avaus ja sulkeminen.
  - assets/js/sitemenu.js

  # Hakuikkunan tyyli (assets/css/search.css) shadow DOM:iin, kentän
  # paikkamerkki suomeksi ja sulkunappi.
  - assets/js/search.js

  # Ohjelmien ajonapit (mdBookin theme/playground_ext.js).
  - assets/js/playground.js

  # Piilorivit ja silmänappi. Ajonapin jälkeen, jotta nappirivin järjestys on
  # sama kuin kirjassa.
  - assets/js/hidelines.js

  # Korostetut rivit; järjestyksellä ei väliä.
  - assets/js/highlights.js

  # Kopiointinapin kuittaus napin viereen teeman alakulman ilmoituksen sijaan;
  # console-lohkosta vain komennot, ja kehote pois hiirellä maalatusta.
  - assets/js/copy.js

  # Terminaalinauhoitusten soitin; soitin ja tyyli haetaan vasta sivulla,
  # jolla on nauhoitus.
  - assets/js/asciinema.js

  # Vaiheittainen ohje. Sivun oma kohtaustiedosto on sisällössä <script>-tagina
  # (convert.py: convert_walkthroughs), joten se on ajettu ennen tätä.
  - assets/js/walkthrough.js

  # Testaa tietosi -visan napit ja vastausten muisti.
  - assets/js/visa.js

  # Koko sivun ääneenluku (convert.py: mark_speech, kaiutin yläpalkissa).
  # Viimeisenä, koska se voi kääriä irrallista tekstiä omiin elementteihinsä
  # vasta, kun muut skriptit ovat muokanneet sisällön.
  - assets/js/puhe.js
