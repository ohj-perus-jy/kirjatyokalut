# Kirjojen yhteiset lychee-asetukset, ks. action.yml ja README.
no_progress = true
max_retries = 3
timeout = 30

# Kaatuu vain 404:stä ja 410:stä.
accept = ["100..=403", "405..=409", "411..=599"]

# Ankkurit (#otsikko) tarkistetaan.
include_fragments = "anchor-only"

exclude = [
  # Vain ulkoiset linkit.
  '^file://',
  # Ankkuri syntyy vasta JavaScriptillä tai on sivun sisäinen reitti.
  '^https://gitlab\.jyu\.fi/.*#L\d',
  '^https://duckduckgo\.com/settings#',
  '^https://pankki\.nordea\.fi/.*#tab=',
  # Palvelin ei lähetä välivarmennetta, joten TLS-tarkistus kaatuu (selain toimii).
  '^https://opencs\.it\.jyu\.fi/',
  # TIM-sivujen oma käyttöliittymä (tyylit, skriptit, kuvakkeet).
  '^https://tim\.jyu\.fi/(js|static|css)/',
]

# SUMMARY.md:n `[nimi<url>]()` näyttää lycheelle tyhjältä URLilta.
exclude_path = ['src/SUMMARY\.md']
